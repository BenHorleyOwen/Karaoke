services:
  node:
    build:
      context: .
      dockerfile: dockerfile.dev
    user: node
    working_dir: /home/node/app
    ports:
      - 5020:5020
    volumes:
      - ./site/:/home/node/app
    environment:
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER
      - NAVIDROME_PASS
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run dev"
    networks:
      - music-server_MusicNet

networks:
  music-server_MusicNet:
    external: true